<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServerPlus - DevOps Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🚀 ServerPlus Dashboard</h1>
        <p>Automated DevOps Monitoring Platform</p>
    </header>

    <section class="card">
        <h2>Server Status</h2>
        <p>🟢 Running</p>
    </section>

    <section class="card">
        <h2>Docker</h2>
        <p>🐳 Not Connected</p>
    </section>

    <section class="card">
        <h2>Jenkins</h2>
        <p>🔄 Not Connected</p>
    </section>

    <section class="card">
        <h2>Deployment</h2>
        <p>☁️ Local Machine</p>
    </section>

    <section class="card">
        <h2>Disk Usage</h2>
        <p>💾 0%</p>
    </section>

    <section class="card">
        <h2>Memory Usage</h2>
        <p>🧠 0%</p>
    </section>

    <footer>
        <p>Version: 1.0.0</p>
        <p id="time"></p>
    </footer>

</div>

<script src="app.js"></script>

</body>
</html>
